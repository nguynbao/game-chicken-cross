<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Crossing Tap - YouTube Playables</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- YouTube Playables SDK v1 (Must be loaded before game bundle) -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #2d5a27;
        touch-action: none;
      }
      #game-container {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        margin: 0 !important;
      }
      @media (min-width: 769px) {
        #game-container canvas {
          border-radius: 28px;
          box-shadow: 0 0 0 4px #182218, 0 18px 40px rgba(10, 20, 10, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
